services:
  - type: web
    name: rouminhighschool
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        value: change-me-in-production
      - key: ALLOWED_HOSTS
        value: rouminhighschool.com,www.rouminhighschool.com,localhost,127.0.0.1
      - key: USE_SQLITE
        value: true
      - key: CSRF_TRUSTED_ORIGINS
        value: https://rouminhighschool.com,https://www.rouminhighschool.com
      - key: PORT
        value: 10000
