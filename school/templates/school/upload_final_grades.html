<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Final Grades</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7fb; color: #0f172a; }
        .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { background: white; width: 100%; max-width: 760px; border-radius: 20px; padding: 24px; box-shadow: 0 16px 40px rgba(15,23,42,0.1); }
        h1 { margin-top: 0; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; }
        select, input, textarea { padding: 10px 12px; border-radius: 10px; border: 1px solid #cbd5e1; width: 100%; }
        button { padding: 10px 14px; border: none; border-radius: 10px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
        .message { padding: 10px 12px; border-radius: 10px; background: #fef2f2; color: #b91c1c; margin-bottom: 12px; border: 1px solid #fecaca; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; }
        th { background: #eff6ff; }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <h1>Upload Final Grades</h1>
            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="get" style="margin-bottom: 16px;">
                <div class="row">
                    <div style="flex:1; min-width: 220px;">
                        <label for="class_id">Select class</label>
                        <select id="class_id" name="class_id" required>
                            {% for school_class in allowed_classes %}
                                <option value="{{ school_class.id }}" {% if selected_class_id|default:'' == school_class.id|stringformat:'s' %}selected{% endif %}>{{ school_class.name }}</option>
                            {% empty %}
                                <option value="">No classes assigned</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div style="flex:1; min-width: 220px;">
                        <button type="submit">Load students</button>
                    </div>
                </div>
            </form>

            <form method="post">
                {% csrf_token %}
                <div class="row">
                    <div style="flex:1; min-width: 220px;">
                        <label for="school_class">Class</label>
                        <select id="school_class" name="school_class" required>
                            {% for school_class in allowed_classes %}
                                <option value="{{ school_class.id }}" {% if selected_class_id|default:'' == school_class.id|stringformat:'s' %}selected{% endif %}>{{ school_class.name }}</option>
                            {% empty %}
                                <option value="">No classes assigned</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div style="flex:1; min-width: 220px;">
                        <label for="term">Term</label>
                        <input id="term" name="term" placeholder="e.g. Term 1" required>
                    </div>
                </div>
                <table>
                    <tr><th>Student</th><th>Marks</th><th>Remarks</th></tr>
                    {% for student in students %}
                    <tr>
                        <td>{{ student.full_name }}</td>
                        <td><input type="number" name="marks_{{ student.id }}" min="0" max="100"></td>
                        <td><input type="text" name="remarks_{{ student.id }}" placeholder="Optional remarks"></td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="3">No students found for the selected class.</td></tr>
                    {% endfor %}
                </table>
                <div style="margin-top: 16px;">
                    <button type="submit">Save Grades</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
