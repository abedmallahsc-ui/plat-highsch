<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Assessment</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #f4f8ff 0%, #fff7ed 100%); color: #0f172a; }
        .card { max-width: 760px; margin: 40px auto; background: white; padding: 28px; border-radius: 20px; box-shadow: 0 16px 40px rgba(15,23,42,0.12); }
        form { display: grid; gap: 12px; }
        textarea { padding: 12px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 15px; min-height: 220px; }
        input[type="file"] { padding: 10px; border-radius: 12px; border: 1px solid #cbd5e1; background: #f8fafc; }
        button { padding: 12px 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #1e40af); color: white; cursor: pointer; font-weight: 700; }
        h1 { margin-top: 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Submit: {{ assessment.title }}</h1>
        <p>{{ assessment.description }}</p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="content">Your answer or notes</label>
            <textarea id="content" name="content" rows="10" cols="80">{{ submission.content }}</textarea>

            <label for="attachment">Upload a file or form</label>
            <input id="attachment" type="file" name="attachment" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt">

            <label for="image">Upload a photo or image</label>
            <input id="image" type="file" name="image" accept="image/*">

            <button type="submit">Submit Work</button>
        </form>
    </div>
</body>
</html>
